spring:
  application:
    name: vitaldash-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vitaldash}
    username: ${DB_USER:vitaldash}
    password: ${DB_PASSWORD:vitaldash}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Schema wird ausschließlich über Flyway verwaltet
  flyway:
    enabled: true
    locations: classpath:db/migration

vitaldash:
  jwt:
    # In Produktion über die Umgebungsvariable JWT_SECRET setzen (mindestens 32 Zeichen)
    secret: ${JWT_SECRET:vitaldash-entwicklungs-geheimnis-nicht-fuer-produktion-0123456789}
    expiration: 8h
  # Legt beim ersten Start Demo-Benutzer an, wenn die Tabelle app_user leer ist
  seed-demo-users: ${SEED_DEMO_USERS:true}
  demo-password: ${DEMO_PASSWORD:demo1234}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
